<!doctype html><html><head><meta charset="utf-8">

<style>

<canvas id="c"></canvas>

<div id="joy"><div id="knob"></div></div>
<div id="btns"><div class="b" id="bgrip">grip</div><div class="b" id="bspit">spit</div><div class="b" id="bair">air</div><div class="b" id="bgrab">grab</div></div>
<div class="b" id="zoom">zoom</div>

<script>
"use strict";
// ---------- setup ----------
const W=320,H=180,N=W*H;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const DBG=/debug/.test(location.search);let seed=(Date.now()%1e9)|0; const qs=new URLSearchParams(location.search); if(qs.get('seed'))seed=+qs.get('seed');
function mul(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
let R=mul(seed);
const rnd=(a=1,b)=>b===undefined?R()*a:a+R()*(b-a);
const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t;
// cell types
const E=0,SAND=1,SOIL=2,ROCK=3,INK=4,MUD=5,ROOT=6;
const MaxM=1,MaxC=.02,MinM=.0001;
let RM,T,Wt,Wn,A,NZ,flux,surf0,occ,open;
let sea=92, tideLevel=92, t=0, day=0.3, storm=0, stormT=0, sediment=[];
// ---------- noise ----------
function mkNoise(){const ph=[];for(let i=0;i<8;i++)ph.push([rnd(6.28),rnd(.5,1.5)]);return x=>{let s=0,a=1,f=1,n=0;for(let i=0;i<5;i++){s+=a*Math.sin(x*f*ph[i][1]+ph[i][0]);n+=a;a*=.5;f*=2.1}return s/n}}
function hash(x,y){let h=(x*374761393+y*668265263+seed*1442695)|0;h=(h^(h>>>13))*1274126177|0;return((h^(h>>>16))>>>0)/4294967296}
// ---------- world gen ----------
let trees=[],nodes=[],roots=[],grass=[],zone={};
function gen(){
 R=mul(seed);T=new Uint8Array(N);RM=new Uint8Array(N);Wt=new Float32Array(N);Wn=new Float32Array(N);A=new Uint8Array(N);NZ=new Float32Array(N);flux=new Float32Array(N);occ=new Uint8Array(N);open=new Uint8Array(N);surf0=new Int16Array(W);
 const n1=mkNoise(),n2=mkNoise(),n3=mkNoise();
 sea=92;tideLevel=sea;
 const mEnd=rnd(.30,.42)*W, bEnd=mEnd+rnd(.15,.22)*W; zone={mEnd,bEnd};
 const back=sea-rnd(12,20), flat=sea+rnd(1.5,3.5), deep=sea+rnd(40,60);
 for(let x=0;x<W;x++){
  let h;
  if(x<mEnd*0.25) h=lerp(back,flat,smooth(x/(mEnd*0.25)));
  else if(x<mEnd) h=flat+n1(x*.08)*2;
  else if(x<bEnd){const u=(x-mEnd)/(bEnd-mEnd);h=lerp(flat,sea+8,u)+n1(x*.05)*1.5}
  else{const u=(x-bEnd)/(W-bEnd);h=lerp(sea+8,deep,smooth(Math.min(1,u*1.4)))+n2(x*.06)*4}
  h=Math.round(h);surf0[x]=h;
  for(let y=h;y<H;y++){
   const i=y*W+x,d=y-h;let ty;
   if(x<mEnd) ty=d<3+n3(x*.2)*1.5+1.5?MUD:SOIL; else ty=d<6+n3(x*.1+5)*3?SAND:SOIL;
   if(y>H-12+n2(x*.03)*5) ty=ROCK;
   T[i]=ty;
  }
 }
 // rock blobs
 for(let k=0;k<26;k++){const cx=rnd(W),cy=rnd(sea-10,H),r=rnd(2,7);const ground=surf0[Math.floor(cx)];if(cy<ground+(cx>bEnd?-1:4))continue;
  for(let y=-r;y<=r;y++)for(let x=-r*1.4;x<=r*1.4;x++){const X=Math.round(cx+x),Y=Math.round(cy+y);if(X<0||X>=W||Y<0||Y>=H)continue;
   const dd=(x*x)/(r*r*1.9)+(y*y)/(r*r);if(dd<1-hash(X,Y)*.25&&(T[Y*W+X]||cx>bEnd))T[Y*W+X]=ROCK}}
 // reef rocks on sea floor
 for(let k=0;k<6;k++){const cx=Math.floor(rnd(bEnd+8,W-6)),r=rnd(2,5),gy=surf0[cx];for(let y=-r;y<=1;y++)for(let x=-r;x<=r;x++){if(x*x+y*y<r*r){const X=cx+x,Y=gy+y;if(X>=0&&X<W)T[Y*W+X]=ROCK}}}
 for(let i=0;i<N;i++){const x=i%W,y=(i/W)|0;const v=(Math.sin(x*.37+Math.sin(y*.21)*2)+Math.sin(y*.43+x*.11)+Math.sin((x+y)*.19))/6+.5;const hh=hash(x,y);NZ[i]=hh>.97||hh<.02?hh:v*.7+hh*.3}
 for(let y=0;y<H;y++)for(let x=0;x<W;x++){const i=y*W+x;if(!T[i]&&y>=sea)Wt[i]=1+(y-sea)*MaxC}
 // starting den near land end
 const sx=Math.floor(mEnd*0.12)+4;
 trees=[];nodes=[];roots=[];grass=[];
 let tx=mEnd*0.2;while(tx<mEnd-6){makeTree(Math.floor(tx));tx+=rnd(14,26)}
 for(const r of roots)for(let s=0;s<r.pts.length-1;s++){const[a0,a1]=r.pts[s],[b0,b1]=r.pts[s+1];for(let k=0;k<=4;k++){const X=Math.round(lerp(a0,b0,k/4)),Y=Math.round(lerp(a1,b1,k/4));const i=Y*W+X;if(X>0&&X<W&&!T[i])RM[i]=1}}
 for(let x=Math.floor(bEnd)+2;x<W-2;x+=rnd(1,3)){const g=surf0[Math.floor(x)];if(T[g*W+Math.floor(x)]===SAND&&rnd()<.6)grass.push({x:Math.floor(x),y:g,h:rnd(3,9),ph:rnd(6)})}
 return sx;
}
function smooth(u){return u*u*(3-2*u)}
function makeTree(x){
 const g=surf0[x],tree={nodes:[],x};trees.push(tree);
 const H0=rnd(20,34);
 function add(px,py,parent,len,ang,k,r){const n={x:px,y:py,px:px,py:py,parent,len,ang,k,r,im:parent<0?0:1/(r*r*.6+.4),tree,leaf:false,load:0};nodes.push(n);tree.nodes.push(n);return nodes.length-1}
 // trunk anchored a little above mud (mangrove on prop roots)
 const base=add(x,g-4,-1,0,0,0,2.2);
 let prev=base,px=x,py=g-4,ang=-Math.PI/2+rnd(-.1,.1);let seg=Math.floor(H0/4);
 const trunk=[base];
 for(let s=0;s<seg;s++){const a=rnd(-.12,.12);ang+=a;const L=4;px+=Math.cos(ang)*L;py+=Math.sin(ang)*L;prev=add(px,py,prev,L,a,.5,2.2*(1-s/seg)+.6);trunk.push(prev)}
 nodes[prev].leaf=true;
 function branch(from,a0,depth,len){let p=from,n=nodes[from],ang=Math.atan2(n.y-nodes[n.parent].y,n.x-nodes[n.parent].x)+a0,x=n.x,y=n.y;const m=Math.floor(len/3);
  for(let s=0;s<m;s++){const a=(s===0?a0:rnd(-.25,.25)+(Math.sign(a0)*-.05));if(s>0)ang+=a;x+=Math.cos(ang)*3;y+=Math.sin(ang)*3+.4;p=add(x,y,p,3,s===0?a0:a,.25-depth*.06,Math.max(.4,1.3-depth*.4-s*.15));if(depth<2&&rnd()<.3)branch(p,rnd(.5,1)*(rnd()<.5?-1:1),depth+1,len*.6)}
  nodes[p].leaf=true}
 for(let s=2;s<trunk.length;s++){if(rnd()<.75)branch(trunk[s],rnd(.6,1.2)*(rnd()<.5?-1:1),0,rnd(10,22))}
 // prop roots: fixed arcs from trunk to mud
 const nr=Math.floor(rnd(4,7));for(let k=0;k<nr;k++){const dir=k%2?1:-1,sp=rnd(4,12)*dir,top=g-rnd(5,12),pts=[];
  const ex=Math.round(x+sp);for(let s=0;s<=8;s++){const u=s/8;const X=lerp(x,ex,u)+Math.sin(u*Math.PI)*dir*2,Y=lerp(top,surf0[clamp(ex,0,W-1)]+1,u*u);pts.push([X,Y])}
  roots.push({pts,r:rnd(.5,.9)});
  for(const p of pts)nodes.push({x:p[0],y:p[1],px:p[0],py:p[1],parent:-1,len:0,ang:0,k:0,r:.6,im:0,tree,leaf:false,load:0,root:true});
 }
 tree.drops=tree.nodes.filter(n=>!n.root&&n.parent>=0&&n.r<1.2&&n.r>.5&&rnd()<.25).slice(0,4);
 // webspinner silk on trunk
 tree.silk={y0:g-rnd(6,9),y1:g+.5};
}
// ---------- water ----------

function stable(tot){if(tot<=1)return 1;if(tot<2*MaxM+MaxC)return(MaxM*MaxM+tot*MaxC)/(MaxM+MaxC);return(tot+MaxC)/2}
const blk=i=>T[i]!==0||A[i]!==0;
function waterStep(){
 Wn.set(Wt);
 for(let y=0;y<H;y++)for(let x=0;x<W;x++){const i=y*W+x;if(blk(i))continue;let m=Wt[i];if(m<=MinM)continue;let rem=m,f;
  if(y<H-1){const b=i+W;if(!blk(b)){f=stable(rem+Wt[b])-Wt[b];if(f>.1)f*=.5;f=clamp(f,0,Math.min(1,rem));Wn[i]-=f;Wn[b]+=f;rem-=f;flux[i]+=f*.3}}
  if(rem<=0)continue;
  if(x>0){const l=i-1;if(!blk(l)){f=(m-Wt[l])/3;f=clamp(f,0,rem);Wn[i]-=f;Wn[l]+=f;rem-=f;flux[i]+=f;flux[l]+=f}}
  if(rem<=0)continue;
  if(x<W-1){const r=i+1;if(!blk(r)){f=(m-Wt[r])/3;f=clamp(f,0,rem);Wn[i]-=f;Wn[r]+=f;rem-=f;flux[i]+=f;flux[r]+=f}}
  if(rem<=0)continue;
  if(y>0){const u=i-W;if(!blk(u)){f=rem-stable(rem+Wt[u]);if(f>.1)f*=.5;f=clamp(f,0,Math.min(1,rem));Wn[i]-=f;Wn[u]+=f;rem-=f}}
 }
 const tmp=Wt;Wt=Wn;Wn=tmp;
 decompress();
 // tide boundary (open sea on right edge)
 const tl=Math.round(tideLevel);
 for(let y=0;y<H;y++)for(let x=W-8;x<W;x++){const i=y*W+x;if(T[i])continue;const tgt=y>=tl?1+(y-tl)*MaxC:0,k=(x-(W-8))/7;Wt[i]=lerp(Wt[i],tgt,k*k)}
 // the sea continues beyond the cut: exchange water through the section plane at the open-sea surface
 for(let x=Math.floor(zone.mEnd*.2);x<W-8;x++){let y=0;for(;y<H;y++){const i=y*W+x;if(T[i])break;if(Wt[i]>.02)break}if(y>=H||T[y*W+x])continue;if(x<zone.bEnd&&y>surf0[x]+1)continue;const i=y*W+x;const lvl=y+1-Math.min(1,Wt[i]);const d=lvl-tideLevel;
  if(d>.3)Wt[i]+=Math.min(.04,d*.02);else if(d<-.3){Wt[i]=Math.max(0,Wt[i]-Math.min(.04,-d*.02));}}
 for(let i=0;i<N;i++){flux[i]*=.9;if(Wt[i]<.003&&Wt[i]>0)Wt[i]*=.97}
}
const tgtA=new Float32Array(W*H);
function decompress(){for(let x=0;x<W;x++){let d=0;for(let y=0;y<H;y++){const i=y*W+x;if(blk(i)||Wt[i]<.5){d=0;tgtA[i]=1;continue}d++;tgtA[i]=1+MaxC*d}
 for(let y=H-1;y>0;y--){const i=y*W+x;if(blk(i))continue;const ex=Wt[i]-tgtA[i];if(ex>0&&!blk(i-W)){const m=ex*.6;Wt[i]-=m;Wt[i-W]+=m}}}}
// air pockets: trapped dry space, bubbles rising
let openTick=0;
function openBFS(){open.fill(0);const q=new Int32Array(N);let h=0,tl=0;
 for(let x=0;x<W;x++){if(!T[x]&&!A[x]&&Wt[x]<.5){open[x]=1;q[tl++]=x}}
 while(h<tl){const i=q[h++],x=i%W;const nb=[i-W,i+W,x>0?i-1:-1,x<W-1?i+1:-1];for(const j of nb){if(j<0||j>=N||open[j])continue;if(T[j]||A[j]||Wt[j]>=.5)continue;open[j]=1;q[tl++]=j}}
 for(let i=W;i<N;i++)if(!T[i]&&!A[i]&&!open[i]&&Wt[i]<.05&&!(Wt[i-W]>.5)){A[i]=1;Wt[i]=0}
}
function airStep(){
 for(let y=1;y<H;y++){const dir=(t&1)?1:-1;for(let k=0;k<W;k++){const x=dir>0?k:W-1-k,i=y*W+x;if(!A[i])continue;const u=i-W;
  if(!T[u]&&!A[u]){if(Wt[u]>.3){A[u]=1;A[i]=0;Wt[i]=Wt[u];Wt[u]=0;continue}else{A[i]=0;continue}}
  // spread under ceiling
  const s=x+dir>=0&&x+dir<W?i+dir:-1;if(s>=0&&!T[s]&&!A[s]&&Wt[s]>.5&&(T[s-W]||A[s-W])&&rnd()<.5){A[s]=1;A[i]=0;Wt[i]=Wt[s];Wt[s]=0;continue}
  // slow dissolution where in contact with water
  if(rnd()<.00035*(1+Math.max(0,y-tideLevel)*.06)&&((!T[i+W]&&Wt[i+W]>.5)||(x>0&&Wt[i-1]>.5)||(x<W-1&&Wt[i+1]>.5))){A[i]=0}
 }}
}
// ---------- granular / erosion ----------
function wetAt(i){return Wt[i]>.2||Wt[i+1]>.2||Wt[i-1]>.2||(i/W|0)>=tideLevel-2}
function grainStep(){
 for(let y=H-2;y>=0;y--){const dir=(t+y)&1?1:-1;for(let k=0;k<W;k++){const x=dir>0?k:W-1-k,i=y*W+x,ty=T[i];if(ty!==SAND&&ty!==SOIL&&ty!==MUD)continue;const b=i+W;
  if(!T[b]&&!A[b]&&!occ[b]){
   let fall=false;
   if(ty===SAND&&!wetAt(i))fall=true;
   else{let sup=0;if(x>0&&T[i-1])sup++;if(x<W-1&&T[i+1])sup++;if(y>0&&T[i-W])sup+=.6;if(sup<(ty===SAND?1.2:1))fall=true}
   if(fall&&(Wt[b]<.5||rnd()<.35)){T[b]=ty;T[i]=0;const w=Wt[b];Wt[b]=0;Wt[i]+=w;NZ[b]=NZ[i];continue}
  }
  if(ty===SAND&&!wetAt(i)&&rnd()<.5){ // angle of repose slide
   const s=x+dir;if(s>=0&&s<W&&!T[i+dir]&&!T[b+dir]&&!occ[b+dir]&&!A[b+dir]){T[b+dir]=SAND;T[i]=0;Wt[i]+=Wt[b+dir];Wt[b+dir]=0}}
 }}
}
function erode(){
 for(let k=0;k<2500;k++){const i=(rnd(N-2*W)|0)+W;const f=flux[i];if(f<.06||Wt[i]<.4)continue;
  const nb=[i+W,i-1,i+1,i-W][(rnd(4))|0];const ty=T[nb];
  if(ty===SAND&&rnd()<(f-.06)*.9){T[nb]=0;Wt[nb]=Wt[i]*.9;sediment.push(nb)}
  else if((ty===SOIL||ty===MUD)&&rnd()<(f-.06)*.12){T[nb]=SAND}
 }
 // deposit where flow slows
 for(let k=0;k<6&&sediment.length;k++){const s=sediment[(rnd(sediment.length))|0];const sx=s%W,sy=s/W|0;
  for(let tr=0;tr<12;tr++){const x=clamp(sx+((rnd(24)-12)|0),1,W-3),y=clamp(sy+((rnd(16)-4)|0),1,H-2),i=y*W+x;
   if(!T[i]&&!A[i]&&!occ[i]&&Wt[i]>.8&&flux[i]<.01&&T[i+W]){T[i]=SAND;Wt[i]=0;sediment.splice(sediment.indexOf(s),1);break}}}
 if(sediment.length>400)sediment.splice(0,sediment.length-400);
}
// ---------- trees physics ----------
let wind=0;
function treeStep(){
 const g=.012;
 for(const n of nodes){if(n.im===0)continue;const vx=(n.x-n.px)*.96,vy=(n.y-n.py)*.96;n.px=n.x;n.py=n.y;
  const wf=wind*(n.leaf?1.6:.4)*(1+Math.sin(t*.05+n.x*.3)*.5);n.x+=vx+wf*n.im*.6;n.y+=vy+g+n.load*n.im;n.load=0}
 for(let it=0;it<4;it++)for(const n of nodes){if(n.parent<0)continue;const p=nodes[n.parent];
  // angular spring toward rest direction relative to parent dir
  let pd=-Math.PI/2;if(p.parent>=0){const gp=nodes[p.parent];pd=Math.atan2(p.y-gp.y,p.x-gp.x)}
  const ta=pd+n.ang,tx=p.x+Math.cos(ta)*n.len,ty=p.y+Math.sin(ta)*n.len;
  const k=Math.min(.6,n.k*1.2);n.x+=(tx-n.x)*k;n.y+=(ty-n.y)*k;
  if(p.im>0){p.x-=(tx-n.x)*k*.15*p.im;p.y-=(ty-n.y)*k*.15*p.im}
  const dx=n.x-p.x,dy=n.y-p.y,d=Math.hypot(dx,dy)||1,diff=(d-n.len)/d,s=n.im+p.im;
  n.x-=dx*diff*n.im/s;n.y-=dy*diff*n.im/s;p.x+=dx*diff*p.im/s;p.y+=dy*diff*p.im/s;
 }
}
// ---------- octopus ----------
const SEG=18;
let oc;
function mkOcto(sx){
 const gy=surf0[sx]-2;const s=[];for(let i=0;i<SEG;i++)s.push({x:sx-i*.6,y:gy,px:sx-i*.6,py:gy});
 const tent=[];for(let k=0;k<8;k++){const c=[];for(let j=0;j<7;j++)c.push({x:sx,y:gy,px:sx,py:gy});tent.push({c,grip:-1,L:0,a:(k/8)*Math.PI*2})}
 return{s,tent,o2:1,food:.7,bub:0,grabbed:null,dig:0,stretch:0,gripOn:false,dead:false,lastMove:0,beakOpen:0,dir:0}
}
function solid(x,y){const X=x|0,Y=y|0;if(X<0||X>=W||Y<0)return X<0||X>=W;if(Y>=H)return true;const i=Y*W+X;return T[i]!==0||RM[i]===1}
function cellI(x,y){return clamp(y|0,0,H-1)*W+clamp(x|0,0,W-1)}
function inWater(x,y){const i=cellI(x,y);return !T[i]&&!A[i]&&Wt[i]>.5}
function resolve(p){if(!solid(p.x,p.y))return true;
 if(!solid(p.px,p.py)){ // slide: try axis separately
  if(!solid(p.x,p.py)){p.y=p.py;return false} if(!solid(p.px,p.y)){p.x=p.px;return false} p.x=p.px;p.y=p.py;return false}
 for(let r=1;r<4;r++)for(let a=0;a<8;a++){const x=p.x+Math.cos(a*.785)*r,y=p.y+Math.sin(a*.785)*r;if(!solid(x,y)){p.x=p.px=x;p.y=p.py=y;return false}}return false}
function los(x0,y0,x1,y1){const d=Math.hypot(x1-x0,y1-y0),n=Math.ceil(d*1.5);for(let k=1;k<n;k++){const u=k/n;if(solid(lerp(x0,x1,u),lerp(y0,y1,u)))return false}return true}
function wallCount(x,y){let c=0;for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1],[1.4,1.4],[-1.4,1.4],[1.4,-1.4],[-1.4,-1.4]])if(solid(x+dx,y+dy))c++;return c}
const input={x:0,y:0,grab:false,air:false,spit:false,grip:false};
function digAt(x,y,rate){const X=x|0,Y=y|0;if(X<1||X>=W-1||Y<1||Y>=H-1)return false;const i=Y*W+X,ty=T[i];if(!ty)return true;
 const hard={1:.16,2:.06,3:0,4:.035,5:.09,6:.012}[ty];if(!hard)return false;oc.dig+=hard*rate;if(oc.dig<1)return false;oc.dig=0;sfx('dig');if(DBG)window.__digs=(window.__digs||0)+1;
